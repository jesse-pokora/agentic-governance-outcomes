name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  # The package claims to work both as a drop-in extension and standalone.
  # That is two claims, so it is two jobs: running only the installed case
  # would leave the fallback untested, and only the fallback would leave the
  # integration untested.
  tests:
    name: tests (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: with agent-sre
            install: "pip install agent-sre"
          - mode: standalone
            install: "echo 'no agent_sre: exercising the spec-faithful fallback'"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ${{ matrix.mode }}
        run: ${{ matrix.install }}

      - name: Report which implementation is in play
        run: python -c "import sys; sys.path.insert(0,'outcomes'); import agt; print('USING_AGENT_SRE =', agt.USING_AGENT_SRE)"

      - name: Run the suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  harness:
    name: harness against the sibling catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the catalog this measures
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: jesse-pokora/agentic-governance-primitives
          path: primitives

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install agent-sre

      # Skips rather than fails when the sibling is not reachable: the harness
      # is a demonstration against real data, not a gate on this package.
      - name: Measure
        run: |
          if [ -d primitives/apps ]; then
            python harness/measure_primitives.py primitives
          else
            echo "sibling catalog not available to this runner; skipping"
          fi
